<!DOCTYPE html>
<html>
    <head>
    <title>Form Biodata</title>
</head>
<body>
    <h1> Form Biodata </h1>

    <form>
        <label>Nama :</label><br>
        <input type="text"><br><br>

        <label>Email :</br>
            <input type="email"><br><br>

            <label>Password : </label><br>
            <input type="password"><br><br>

            <label>Umur : </label><br>
            <input type="number"><br><br>

                <label>Nomor Telepon :</label><br>
                <input type="tel"><br><br>

                <label>Tanggal Lahir :</label><br>
                <input type="date"><br><br>

                <label>Jenis Kelamin :</label><br>
                <input type="radio" name="Jenis kelamin" value="Laki-laki">
                <label>Laki-laki</label><br>

                <input type="radio" name="Jenis kelamin" value="Perempuan">
                <label>Perempuan</label><br><br>

                <label>Hobi :</label><br>
                <input type="checkbox" name="Hobi" value="membaca">
                <label>Membaca</label><br>

                <input type="checkbox" name="Hobi" value="bermain game">
                <label>bermain game</label><br>

                <input type="checkbox" name="Hobi" value="Berenang">
                <label>Berenang</label><br><br>

                <label>Kota asal : </label><br>
                <select name="Kota">
                    <option value="Medan">Medan</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Bandung">Bandung</option>
                    <option value="Surabaya ">Surabaya</option>
                </select><br><br>

                <label>Kolom Komentar</label><br>
                <textarea name="Kolom Komentar" rows="5" cols="30"></textarea><br><br>

            <button type="reset">reset</button>
            <button type="submit">kirim</button>

        </form>
    </body>
</html>
