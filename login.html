<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ridwan Maulana</title>
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1><a href="index.html" class="nav-brand">Web Developer</a></h1>
            <div class="Menu" id="navMenu">
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#projects">Projects</a>
                <a href="index.html#contact">Contact</a>
                <a href="project-form.html" class="nav-admin" id="navDashboard" hidden>Dashboard</a>
                <a href="#" class="nav-admin" id="logoutBtn" hidden>Logout</a>
            </div>
            <div class="nav-actions">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
                    <i class="fa-solid fa-sun" id="themeIcon"></i>
                </button>
                <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main class="manage-page">
        <div class="auth-card">
            <h2>LOGIN ADMIN</h2>
            <p class="auth-subtitle">Sign in to manage portfolio projects</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <p id="loginError" class="form-message error"></p>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <a href="./" class="auth-back">&larr; Back to Portfolio</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MHD Ridwan Maulana</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
