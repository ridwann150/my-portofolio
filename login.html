<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ridwan Maulana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Full Stack Developer</h1>
           <div class="Menu">
    <a href="./">Home</a>
    <a href="./#about">About</a>
    <a href="./#projects">Projects</a>
    <a href="login.html">Login</a>
</div>
        </nav>
    </header>

    <main class="manage-page">
        <div class="auth-card">
            <h2>LOGIN ADMIN</h2>
            <p class="auth-subtitle">Sign in to manage portfolio projects</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <p id="loginError" class="form-message error"></p>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <a href="./" class="auth-back">&larr; Back to Portfolio</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MHD Ridwan Maulana</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
